name: Standalone CLI and stdio MCP

on:
  workflow_call:
    inputs:
      version-base:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: Build and test CLI package (Linux)
    runs-on: ubuntu-latest
    env:
      TASKHUB_VERSION_BASE: ${{ inputs.version-base }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile standalone tests
        run: npm run compile-tests

      - name: Build standalone CLI package
        run: npm run package:cli

      - name: Test offline install, CLI and stdio MCP
        run: npm run test:cli-package

      - name: Upload tested CLI package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-cli
          path: dist/taskhub-cli-*.tgz
          if-no-files-found: error

  windows:
    name: Test CLI package (Windows)
    needs: package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile standalone tests
        run: npm run compile-tests

      - name: Download Linux-built package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standalone-cli
          path: dist

      - name: Test offline install, CLI and stdio MCP
        env:
          # This job reaches the runner's administrative share, so the UNC workspace test must not skip.
          TASKHUB_REQUIRE_UNC: '1'
        run: npm run test:cli-package
